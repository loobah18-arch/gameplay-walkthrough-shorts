name: ⏰ 24-Hour Daily Walkthrough Cutscene Shorts Pipeline

on:
  schedule:
    # Auto-calculated by core/schedule_updater.py to trigger at the exact 24h due minute (UTC).
    # Falls back to hourly check ('0 * * * *') when no published upload exists yet.
    - cron: '0 * * * *'

  workflow_dispatch:
    inputs:
      game:
        description: 'Target Game (auto = rotate catalog, or detroit_become_human, gta_v, red_dead_redemption_2, god_of_war_ragnarok, cyberpunk_2077, the_last_of_us)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'detroit_become_human'
          - 'gta_v'
          - 'red_dead_redemption_2'
          - 'god_of_war_ragnarok'
          - 'cyberpunk_2077'
          - 'the_last_of_us'
      force_run:
        description: 'Bypass 24-hour pre-flight spacing gate'
        required: false
        default: false
        type: boolean
      publish_to_youtube:
        description: 'Publish rendered Short to YouTube (default: false)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-walkthrough-short-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight_gate:
    name: 🕯️ Algorithm Safety Pre-flight Gate (Zero-Sleep)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      due_at: ${{ steps.gate.outputs.due_at }}
      next_cron: ${{ steps.gate.outputs.next_cron }}

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Lightweight Gate Dependencies
        run: |
          python3 -m pip install --quiet google-api-python-client google-auth

      - name: 🕯️ Evaluate Layer 0 (24h) & Layer 1/2 Channel Telemetry
        id: gate
        env:
          PREFLIGHT_BYPASS: ${{ inputs.force_run || github.event_name != 'schedule' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID || secrets.CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python3 core/preflight_gate.py

  daily_walkthrough_short:
    name: 🎮 24h Autonomous Cutscene Clipper
    needs: preflight_gate
    if: needs.preflight_gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 🛡️ Launch bgutil PO Token Provider Container
        run: |
          docker run -d --name bgutil-provider --restart always -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider 2>/dev/null || true
          for i in {1..10}; do
            if curl -s http://127.0.0.1:4416/ping 2>/dev/null | grep -q "version"; then
              echo "✅ bgutil Docker ready on :4416"
              break
            fi
            sleep 1
          done
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_WORKFLOW_PAT || github.token }}

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install FFmpeg & Fonts (Non-Interactive)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 update -qq
          PKGS="fonts-montserrat fonts-dejavu-core fontconfig libsndfile1"
          command -v ffmpeg >/dev/null 2>&1 || PKGS="ffmpeg $PKGS"
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 install -y -qq --no-install-recommends $PKGS
          sudo fc-cache -f 2>/dev/null || true

      - name: 📦 Install Python & Node Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -U --pre yt-dlp yt-dlp-ejs bgutil-ytdlp-pot-provider faster-whisper soundfile
          pip install -r requirements.txt
          sudo npm install -g youtube-po-token-generator 2>/dev/null || npm install -g youtube-po-token-generator || true

      - name: 🔍 Verify bgutil PO Token Service Health
        run: |
          echo "Checking bgutil PO token service on port 4416..."
          for i in 1 2 3 4 5; do
            if curl -sf http://127.0.0.1:4416/ping 2>/dev/null; then
              echo "✅ bgutil PO token provider is healthy on port 4416"
              break
            fi
            sleep 2
          done

      - name: 🛡️ Generate YouTube PO Token via Node.js
        id: pot_gen
        run: |
          set -uo pipefail
          GLOBAL_NODE_ROOT="$(npm root -g 2>/dev/null || true)"
          POT_JSON=$(NODE_PATH="$GLOBAL_NODE_ROOT" timeout 30 node -e "
            const { generate } = require('youtube-po-token-generator');
            generate().then(r => { console.log(JSON.stringify(r)); }).catch(e => { console.log('{}'); });
          " 2>/dev/null || echo '{}')

          PO_TOKEN=$(echo "$POT_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('poToken',''))" 2>/dev/null || echo "")
          VISITOR_DATA=$(echo "$POT_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('visitorData',''))" 2>/dev/null || echo "")

          if [ -n "$PO_TOKEN" ] && [ -n "$VISITOR_DATA" ]; then
            echo "✅ PO Token generated successfully"
            echo "po_token=$PO_TOKEN" >> "$GITHUB_OUTPUT"
            echo "visitor_data=$VISITOR_DATA" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ PO Token empty; relying on local bgutil container service on port 4416"
            echo "po_token=" >> "$GITHUB_OUTPUT"
            echo "visitor_data=" >> "$GITHUB_OUTPUT"
          fi

      - name: 🍪 Decode YouTube Cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail
          python3 -c "
          import os
          from core.cookie_manager import CookieManager
          raw = os.environ.get('YOUTUBE_COOKIES', '').strip()
          if raw:
              CookieManager.export_cookie_file(raw, 'youtube_cookies.txt')
              info = CookieManager.validate_cookies_content(CookieManager.decode_cookie_data(raw))
              print(f'🍪 Exported youtube_cookies.txt (valid={info[\"valid\"]}, expired={info[\"expired_count\"]})')
          else:
              print('ℹ️ No YOUTUBE_COOKIES secret configured. Will attempt download via public client.')
          "

      - name: 🎬 Autonomous Cutscene Crawl, Question Hook & Letterbox Render
        env:
          INPUT_GAME: ${{ inputs.game }}
          FORCE_RUN: ${{ inputs.force_run }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_PROXY: ${{ secrets.YOUTUBE_PROXY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID || secrets.CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN || secrets.REFRESH_TOKEN }}
          YT_PO_TOKEN: ${{ steps.pot_gen.outputs.po_token }}
          YT_VISITOR_DATA: ${{ steps.pot_gen.outputs.visitor_data }}
        run: |
          set -euo pipefail
          COOKIE_ARGS=()
          if [ -f youtube_cookies.txt ]; then
            COOKIE_ARGS=(--cookies youtube_cookies.txt)
          fi

          POT_ARGS=()
          if [ -n "$YT_PO_TOKEN" ]; then
            POT_ARGS=(--po-token "$YT_PO_TOKEN" --visitor-data "$YT_VISITOR_DATA")
          fi

          GAME_ARG=()
          if [ -n "$INPUT_GAME" ] && [ "$INPUT_GAME" != "auto" ]; then
            GAME_ARG=(--game "$INPUT_GAME")
          fi

          FORCE_ARG=()
          if [ "$FORCE_RUN" = "true" ]; then
            FORCE_ARG=(--force)
          fi

          UPLOAD_ARG=(--no-upload)
          if [ "${{ inputs.publish_to_youtube }}" = "true" ]; then
            UPLOAD_ARG=(--upload)
          fi

          python3 cli.py daily-job \
            "${GAME_ARG[@]}" \
            "${FORCE_ARG[@]}" \
            "${UPLOAD_ARG[@]}" \
            "${COOKIE_ARGS[@]}" \
            "${POT_ARGS[@]}"

      - name: 📅 Calculate Next Exact Upload Cron & Commit History
        if: always()
        env:
          HAS_WORKFLOW_PAT: ${{ secrets.GH_WORKFLOW_PAT != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          python3 core/schedule_updater.py --apply

          git add upload_history.json question_history.json candle_gate_state.json 2>/dev/null || true
          if [ "$HAS_WORKFLOW_PAT" = "true" ]; then
            git add .github/workflows/daily_walkthrough_short.yml 2>/dev/null || true
          else
            echo "ℹ️ GH_WORKFLOW_PAT secret not configured — keeping hourly fallback cron ('0 * * * *') cleanly on GitHub."
            git checkout -- .github/workflows/daily_walkthrough_short.yml 2>/dev/null || true
          fi

          if git diff --staged --quiet; then
            echo "No history or schedule changes to commit."
          else
            git commit -m "chore(schedule): update upload history and next exact cron [skip ci]"
            git push origin HEAD:${{ github.ref }} || echo "Push skipped or already up to date."
          fi

      - name: 📦 Upload Generated Letterbox Short Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-gameplay-short-letterbox
          path: output/*.mp4
          retention-days: 14
          if-no-files-found: ignore
