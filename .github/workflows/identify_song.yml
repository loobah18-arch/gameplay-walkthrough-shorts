name: 🎵 Identify BGM Pitch Variations

on:
  workflow_dispatch:

jobs:
  identify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tools
        run: |
          pip install shazamio
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate Speed Variations & Shazam
        run: |
          python3 -c "
          import asyncio, subprocess
          from shazamio import Shazam

          async def check():
              shazam = Shazam()
              # test original, 0.75x, 0.8x, 0.85x, 0.9x, 1.1x, 1.2x
              speeds = [1.0, 0.75, 0.8, 0.83, 0.85, 0.9, 0.95, 1.15, 1.25]
              for sp in speeds:
                  out_wav = f'test_{sp}.wav'
                  subprocess.run(['ffmpeg', '-y', '-i', 'assets/audio/default_bgm.mp3', '-filter:a', f'atempo={sp}', out_wav], check=True, stderr=subprocess.DEVNULL)
                  res = await shazam.recognize(out_wav)
                  track = res.get('track')
                  if track:
                      print(f'>>> SUCCESS AT {sp}x! Title: {track.get(\"title\")}, Artist: {track.get(\"subtitle\")}')
                      return
                  else:
                      print(f'No match at {sp}x')

          asyncio.run(check())
          "
