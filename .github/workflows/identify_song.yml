name: 🎵 Identify BGM with Whisper & Shazam

on:
  workflow_dispatch:

jobs:
  identify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tools
        run: |
          pip install faster-whisper shazamio
      - name: Run Whisper & Shazam Analysis
        run: |
          python3 -c "
          import asyncio
          from faster_whisper import WhisperModel
          from shazamio import Shazam

          print('=== 1. WHISPER TRANSCRIPTION ===')
          model = WhisperModel('small', device='cpu', compute_type='int8')
          segments, info = model.transcribe('assets/audio/default_bgm.mp3')
          print('Detected language:', info.language, 'prob:', info.language_probability)
          transcription = ' '.join([s.text for s in segments])
          print('TRANSCRIPTION:', transcription)

          print('=== 2. SHAZAM RECOGNITION ===')
          async def run_shazam():
              shazam = Shazam()
              out = await shazam.recognize('assets/audio/default_bgm.mp3')
              print('SHAZAM_MATCHES:', out.get('matches'))
              print('SHAZAM_TRACK:', out.get('track'))
          asyncio.run(run_shazam())
          "
