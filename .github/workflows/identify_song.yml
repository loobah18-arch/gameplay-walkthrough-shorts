name: 🎵 Identify BGM with Whisper & Shazam

on:
  workflow_dispatch:

jobs:
  identify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tools
        run: |
          pip install faster-whisper shazamio
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Slice Audio & Run Shazam
        run: |
          # Slice 2s to 10s (pure music, no intro/outro)
          ffmpeg -y -i assets/audio/default_bgm.mp3 -ss 00:00:02 -to 00:00:10 -c:a pcm_s16le clean_slice.wav
          python3 -c "
          import asyncio
          from shazamio import Shazam

          async def run():
              shazam = Shazam()
              out = await shazam.recognize('clean_slice.wav')
              track = out.get('track')
              print('CLEAN_SLICE_MATCH:', track)
              if track:
                  print('FOUND_TITLE:', track.get('title'))
                  print('FOUND_ARTIST:', track.get('subtitle'))
          asyncio.run(run())
          "
          python3 test_segments.py
