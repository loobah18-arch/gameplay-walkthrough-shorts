name: 🎮 Render Gameplay Walkthrough Short

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Walkthrough / Cutscene Video URL'
        required: true
        default: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
      start_time:
        description: 'Start timestamp in seconds (or HH:MM:SS)'
        required: true
        default: '0'
      end_time:
        description: 'End timestamp in seconds (or HH:MM:SS)'
        required: true
        default: '55'
      aspect_ratio:
        description: 'Aspect ratio (square 1:1 like SaisenGames kepvkxTGqVM, or vertical 9:16)'
        required: true
        default: 'square'
        type: choice
        options:
          - 'square'
          - 'square_hd'
          - 'vertical_crop'
          - 'vertical_blurred'
      title:
        description: 'Title for the generated Short'
        required: false
        default: 'Epic Cutscene Moment'
      game_name:
        description: 'Game Name (e.g., Detroit: Become Human, GTA 5)'
        required: false
        default: 'Detroit: Become Human'
      top_question:
        description: 'Optional AniDoc engaging question hook on top (leave blank to auto-generate)'
        required: false
        default: ''
      enable_subtitles:
        description: 'Burn dynamic ASS subtitles'
        required: false
        default: true
        type: boolean
      upload_to_youtube:
        description: 'Upload generated Short to YouTube (requires YouTube OAuth setup)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: walkthrough-short-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render_short:
    name: 🎬 Render Walkthrough Short (Cloud Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      # PO Token Provider to bypass YouTube bot detection
      bgutil-provider:
        image: brainicism/bgutil-ytdlp-pot-provider:latest
        ports:
          - 4416:4416

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev fonts-montserrat fonts-dejavu-core

      - name: 📦 Install Python & Node Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -U yt-dlp yt-dlp-ejs bgutil-ytdlp-pot-provider
          pip install -r requirements.txt
          sudo npm install -g youtube-po-token-generator 2>/dev/null || npm install -g youtube-po-token-generator || true

      - name: 🔍 Verify Anti-Bot Service Health
        run: |
          echo "Checking bgutil PO token service..."
          for i in 1 2 3 4 5; do
            if curl -sf http://127.0.0.1:4416/ping 2>/dev/null; then
              echo "✅ bgutil PO token provider is healthy on port 4416"
              break
            fi
            echo "Waiting for bgutil service to initialize..."
            sleep 2
          done

      - name: 🛡️ Generate YouTube PO Token via Node.js
        id: pot_gen
        run: |
          set -uo pipefail
          GLOBAL_NODE_ROOT="$(npm root -g 2>/dev/null || true)"
          POT_JSON=$(NODE_PATH="$GLOBAL_NODE_ROOT" timeout 30 node -e "
            const { generate } = require('youtube-po-token-generator');
            generate().then(r => { console.log(JSON.stringify(r)); }).catch(e => { console.log('{}'); });
          " 2>/dev/null || echo '{}')

          PO_TOKEN=$(echo "$POT_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('poToken',''))" 2>/dev/null || echo "")
          VISITOR_DATA=$(echo "$POT_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('visitorData',''))" 2>/dev/null || echo "")

          if [ -n "$PO_TOKEN" ] && [ -n "$VISITOR_DATA" ]; then
            echo "✅ PO Token generated successfully (len=${#PO_TOKEN})"
            echo "po_token=$PO_TOKEN" >> "$GITHUB_OUTPUT"
            echo "visitor_data=$VISITOR_DATA" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ PO Token generation skipped/empty — will rely on bgutil service & progressive tiers"
            echo "po_token=" >> "$GITHUB_OUTPUT"
            echo "visitor_data=" >> "$GITHUB_OUTPUT"
          fi

      - name: 🍪 Decode YouTube Cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail
          python3 -c "
          import os
          from core.cookie_manager import CookieManager
          raw = os.environ.get('YOUTUBE_COOKIES', '').strip()
          if raw:
              CookieManager.export_cookie_file(raw, 'youtube_cookies.txt')
              info = CookieManager.validate_cookies_content(CookieManager.decode_cookie_data(raw))
              print(f'🍪 Exported youtube_cookies.txt (valid={info[\"valid\"]}, expired={info[\"expired_count\"]})')
          else:
              print('⚠️ No YOUTUBE_COOKIES secret configured. Will attempt download via public client.')
          "

      - name: 🎬 Render Walkthrough Short
        id: render
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          START_TIME: ${{ inputs.start_time }}
          END_TIME: ${{ inputs.end_time }}
          ASPECT_RATIO: ${{ inputs.aspect_ratio }}
          CLIP_TITLE: ${{ inputs.title }}
          GAME_NAME: ${{ inputs.game_name }}
          TOP_QUESTION: ${{ inputs.top_question }}
          ENABLE_SUBS: ${{ inputs.enable_subtitles }}
          UPLOAD_TO_YT: ${{ inputs.upload_to_youtube }}
          YOUTUBE_PROXY: ${{ secrets.YOUTUBE_PROXY }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YT_PO_TOKEN: ${{ steps.pot_gen.outputs.po_token }}
          YT_VISITOR_DATA: ${{ steps.pot_gen.outputs.visitor_data }}
        run: |
          set -euo pipefail
          COOKIE_ARGS=()
          if [ -f youtube_cookies.txt ]; then
            COOKIE_ARGS=(--cookies youtube_cookies.txt)
          fi

          SUBS_FLAG=()
          if [ "$ENABLE_SUBS" = "true" ]; then
            SUBS_FLAG=(--enable-subtitles)
          fi

          POT_ARGS=()
          if [ -n "$YT_PO_TOKEN" ]; then
            POT_ARGS=(--po-token "$YT_PO_TOKEN" --visitor-data "$YT_VISITOR_DATA")
          fi

          TOP_Q_ARG=()
          if [ -n "$TOP_QUESTION" ]; then
            TOP_Q_ARG=(--top-question "$TOP_QUESTION")
          fi

          OUT_NAME=$(python3 -c "
          import os, re
          title = os.environ.get('CLIP_TITLE', '').strip()
          ratio = os.environ.get('ASPECT_RATIO', 'square')
          slug = re.sub(r'[^A-Za-z0-9]+', '_', title).strip('_')[:48]
          print(f'{slug}_{ratio}.mp4' if slug else '')
          ")

          OUT_ARGS=()
          if [ -n "$OUT_NAME" ]; then
            OUT_ARGS=(--output "$OUT_NAME")
          fi

          echo "🎮 Game: $GAME_NAME | Title: $CLIP_TITLE"
          python3 cli.py render-cloud-job \
            --url "$VIDEO_URL" \
            --start "$START_TIME" \
            --end "$END_TIME" \
            --aspect-ratio "$ASPECT_RATIO" \
            --game "$GAME_NAME" \
            --title "$CLIP_TITLE" \
            "${SUBS_FLAG[@]}" \
            "${COOKIE_ARGS[@]}" \
            "${POT_ARGS[@]}" \
            "${TOP_Q_ARG[@]}" \
            "${OUT_ARGS[@]}"

      - name: 📦 Upload Generated Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-short-${{ inputs.aspect_ratio }}
          path: output/*.mp4
          retention-days: 14
          if-no-files-found: error
